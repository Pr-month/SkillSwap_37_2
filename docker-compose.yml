services:
  db:
    image: postgres:latest
    container_name: skillswap-db
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_PORT"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - internal
    ports:
      - "${DB_PORT:-5432}:5432"

volumes:
  # frontend:
  # public:
  db:

  networks:
    internal:
      driver: bridge